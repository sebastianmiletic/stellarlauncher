name: Stellar Rust engine preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      HORIZON_REVISION: 0a875da91dbb0fdcb7ba8c42c11341aa229af51a
      RUST_VERSION: 1.99.1
      CARGO_INCREMENTAL: 0
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare pinned engine source
        shell: bash
        run: |
          engine="$RUNNER_TEMP/horizon"
          git init --quiet "$engine"
          git -C "$engine" fetch --depth=1 https://github.com/arismoko/horizon.git "$HORIZON_REVISION"
          git -C "$engine" checkout --detach FETCH_HEAD
          test "$(git -C "$engine" rev-parse HEAD)" = "$HORIZON_REVISION"
          git -C "$engine" apply "$GITHUB_WORKSPACE/tools/archive/horizon-patches/stellar-title-motion.patch" \
            "$GITHUB_WORKSPACE/tools/archive/horizon-patches/spear-movement.patch"
          echo "HORIZON_GAME_BUILD_ID=stellar-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build the Metal client
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          cd "$RUNNER_TEMP/horizon"
          cargo "+$RUST_VERSION" build --locked --profile fast -p horizon-game --bin horizon-client
          target/fast/horizon-client --help

      - name: Archive the preview and license
        shell: bash
        run: |
          engine="$RUNNER_TEMP/horizon"
          tar -czf "$RUNNER_TEMP/stellar-rust-engine-macos-arm64.tar.gz" \
            -C "$engine/target/fast" horizon-client \
            -C "$engine" LICENSE LICENSES

      - uses: actions/upload-artifact@v6
        with:
          name: stellar-rust-engine-macos-arm64
          path: ${{ runner.temp }}/stellar-rust-engine-macos-arm64.tar.gz
          if-no-files-found: error
